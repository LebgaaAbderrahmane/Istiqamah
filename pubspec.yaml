name: istiqamah
description: "A Muslim-focused habit tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  geolocator: ^14.0.3
  permission_handler: ^11.4.0
  dio: ^5.8.0+1
  connectivity_plus: ^7.2.0
  flutter_local_notifications: ^18.0.1
  hijri: ^3.0.0
  flutter_screenutil: ^5.9.3
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.5

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "images/istiqamah_logo.png"
  background_color: "#0D1B1E"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FAF7F2"
  color_dark: "#0D1B1E"
  image: "images/istiqamah_logo_splash.png"
  image_dark: "images/istiqamah_logo_splash.png"
  android_12:
    color: "#FAF7F2"
    color_dark: "#0D1B1E"
    image: "images/istiqamah_logo_splash.png"
    image_dark: "images/istiqamah_logo_splash.png"

flutter:
  uses-material-design: true
  assets:
    - images/
